name: Hospital Agent CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hospital-agent-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Hospital-agent-main/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
